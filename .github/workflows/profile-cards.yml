name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: TanishhTiwarii
          cards: overview,momentum,contributions,lifetime,repositories,languages
          output-dir: profile-cards
          themes: light,dark
          language-limit: 8
          legend: ramp
          commit: true
          commit-message: "chore(profile): refresh GitHub profile cards"
